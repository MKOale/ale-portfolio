<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140" width="420" height="140">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0b429;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a6cf7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f4abf;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="420" height="140" rx="10" fill="#0d1117"/>

  <!-- Left accent bar -->
  <rect x="18" y="20" width="4" height="100" rx="2" fill="url(#goldGrad)"/>

  <!-- MKO Monogram block -->
  <rect x="32" y="20" width="80" height="80" rx="6" fill="url(#blueGrad)"/>

  <!-- M -->
  <text x="43" y="76" font-family="Georgia, serif" font-weight="700" font-size="48" fill="white" letter-spacing="-2">M</text>

  <!-- KO small stacked -->
  <text x="85" y="54" font-family="Georgia, serif" font-weight="700" font-size="22" fill="url(#goldGrad)">K</text>
  <text x="85" y="78" font-family="Georgia, serif" font-weight="700" font-size="22" fill="url(#goldGrad)">O</text>

  <!-- Divider line -->
  <line x1="128" y1="28" x2="128" y2="112" stroke="#1a6cf7" stroke-width="1" opacity="0.4"/>

  <!-- Company name -->
  <text x="142" y="52" font-family="Georgia, serif" font-weight="700" font-size="22" fill="white" letter-spacing="1">MKO</text>
  <text x="142" y="75" font-family="Arial, sans-serif" font-weight="400" font-size="13" fill="#e8e6e1" letter-spacing="2.5">GLOBAL BUSINESS</text>
  <text x="142" y="93" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="url(#goldGrad)" letter-spacing="4">ESTATE</text>

  <!-- Tagline -->
  <line x1="142" y1="102" x2="400" y2="102" stroke="#1a6cf7" stroke-width="0.5" opacity="0.5"/>
  <text x="142" y="116" font-family="Arial, sans-serif" font-weight="300" font-size="10" fill="#5a6478" letter-spacing="2">WEB SOLUTIONS &amp; DIGITAL SERVICES</text>

  <!-- Right decorative dots -->
  <circle cx="390" cy="35" r="3" fill="#1a6cf7" opacity="0.6"/>
  <circle cx="400" cy="35" r="3" fill="url(#goldGrad)" opacity="0.8"/>
  <circle cx="390" cy="45" r="3" fill="url(#goldGrad)" opacity="0.4"/>
  <circle cx="400" cy="45" r="3" fill="#1a6cf7" opacity="0.6"/>
</svg>
